---
layout: base
---
<div class="page-head">
  <h1>{{ page.title }}</h1>
  {%- if page.lede %}<p class="page-head__lede">{{ page.lede }}</p>{% endif %}
  {%- if page.actions %}
  <div class="btn-row mt-5">
    {%- for act in page.actions %}
    <a class="btn{% if forloop.first %} btn--primary{% endif %}" href="{{ act.url | relative_url }}">
      {%- if act.icon %}{% include icon.html name=act.icon %}{% endif %} {{ act.text }}
    </a>
    {%- endfor %}
  </div>
  {%- endif %}
</div>

<div class="prose">
  {{ content }}
</div>
