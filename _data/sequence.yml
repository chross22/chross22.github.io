# A photo sequence rendered as a full-bleed banner under the masthead.
# Frames show in the order listed.
#
# Three frames, not four: the original third exposure had the fluke tip running
# off the top edge, which reads as a mistake at banner size. Its file is gone;
# to restore it, re-export IMG_0434 and add it back as the second entry.
#
# Files are named lobtail-N.jpg rather than sequence-N.jpg: an earlier edit
# reused sequence-3.jpg for different content, and browsers that had seen the
# old one served it from cache. Never re-point an existing image path at
# different bytes — give it a new name.
#
# Originals were PNG, which is the wrong container for photographs — stored as
# JPEG at quality 80, visually identical at a fifth of the bytes.

enabled: true

credit: "Photographs by Camille H. Ross"
# No caption: the frames read on their own, and each is described in its `alt`
# for anyone who cannot see them.
# Add `where:` to show a place and year, e.g. "Stellwagen Bank, 2015"
where: ""

frames:
  - file: "lobtail-1.jpg"
    alt: "A humpback whale's fluke held high above the sea, the white underside
      angled towards the camera, water still streaming from its trailing edge."
  - file: "lobtail-2.jpg"
    alt: "The fluke upright and fully spread, both lobes clear of the water, the
      tail stock rising vertically from a patch of turquoise water."
  - file: "lobtail-3.jpg"
    alt: "The fluke has gone; a wall of white spray stands where it struck the
      surface and a wave rolls outward across the swell."
