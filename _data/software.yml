# Public R packages and analysis code.
# `group` drives the headings on /code/, and groups appear in the order they
# first occur below — so the leading entry sets the first heading on the page.
# taupatch leads: it implements the method in Ross et al. (2023).
# To add a package, copy a block.
# `docs` is the pkgdown reference site, built by each repo's pkgdown
# workflow on every push to its default branch and served from
# camilleross.org/<package>/ — GitHub applies this site's custom domain to
# every project page on the account. Omit the key when a package has no
# published site yet; /code/ then shows only the repo button rather than
# linking somewhere that 404s.

- name: "taupatch"
  group: "Models"
  language: "R"
  status: "maintained"
  summary: "Builds monthly habitat suitability models for high-abundance zooplankton patches
    (\"tau-patches\"), where a patch is defined by a species-specific abundance threshold.
    Point-and-click Shiny app or YAML-driven package."
  example: |
    config <- load_config("study.yaml")
    run_taupatch_app()   # or use the config
  schematic: "threshold-map"
  docs: "https://camilleross.org/taupatch/"
  repo: "https://github.com/chross22/taupatch"
  paper: "/publication/2023-01-12-calanus-finmarchicus-thresholds"

- name: "dsfit"
  group: "Models"
  language: "R"
  status: "maintained"
  summary: "Fits a set of candidate detection functions to line-transect distance data and
    compares them on the quantities that actually matter for abundance — effective strip
    half-width and its coefficient of variation — rather than on the Akaike information
    criterion alone. Includes the gamma key that
    Distance::ds() does not offer."
  example: |
    sw <- sweep_models(
      detections,
      model_set(key = c("hn", "hr")),
      truncation = 400)
  schematic: "detection-curves"
  docs: "https://camilleross.org/dsfit/"
  repo: "https://github.com/chross22/dsfit"

- name: "narwcr"
  group: "Survey data"
  language: "R"
  status: "maintained"
  summary: "Reads marine mammal survey data recorded in the North Atlantic Right Whale
    Consortium (NARWC) database format and puts it into a single, predictable shape,
    reconciling the column names that different survey programs use for the same thing."
  example: |
    dat <- read_narwc("extract.csv")
    narwc_column_mapping(dat)
  schematic: "column-tidy"
  docs: "https://camilleross.org/narwcr/"
  repo: "https://github.com/chross22/narwcr"

- name: "distsamp"
  group: "Survey data"
  language: "R"
  status: "maintained"
  summary: "Turns aerial line-transect survey data from the NARWC database into effort
    segments ready for Distance and dsm — each with a location, an amount of effort, and
    counts of what was seen along it. Where the survey recorded declination angles,
    perpendicular distances come out in the shape a detection function wants."
  example: |
    dat  <- read_narwc(path)
    validate_narwc(dat)   # never stops
    segs <- segment_survey(dat, 5)
  schematic: "transect-segments"
  docs: "https://camilleross.org/distsamp/"
  repo: "https://github.com/chross22/distsamp"

- name: "datamatch"
  group: "Environmental covariates"
  language: "R"
  status: "maintained"
  summary: "Fetches ocean and atmosphere data from seven sources — Copernicus Marine, HYCOM,
    FVCOM, NOAA CEFI, CCMP, NOAA ERDDAP and NASA OB.DAAC — behind one interface and one set of variable names: ask for
    SST, not thetao, and the catalog finds the product. The join is a general spatiotemporal
    nearest-feature match, so either side can be sightings, survey stations, tag positions, or
    another gridded product. It also resamples products onto a common resolution, fills gaps in
    satellite ocean colour, and supplies seafloor terrain and basin-scale climate indices. Every
    value keeps a record of the source it came from, because SST from three models is three
    different numbers."
  example: |
    env <- accessCopernicus(
      vars = c("SST", "SSS", "MLD"),
      years = 2003:2017, months = 1:12,
      bounding_box = bb)
    matched <- matchData(sightings, env)
  schematic: "grid-join"
  docs: "https://camilleross.org/datamatch/"
  repo: "https://github.com/chross22/datamatch"

- name: "derivoce"
  group: "Environmental covariates"
  language: "R"
  status: "maintained"
  summary: "Computes derived oceanographic covariates from gridded ocean data — spatial and
    temporal gradients, time-integrated variables, calendar-unit lags, eddy kinetic energy,
    Lyapunov exponents, and distances to fronts and shore."
  example: |
    grad  <- horizontal_gradient(sst)
    shore <- distance_to_shore(grid)
  schematic: "gradient-field"
  docs: "https://camilleross.org/derivoce/"
  repo: "https://github.com/chross22/derivoce"

- name: "fancyfx"
  group: "Visualization"
  language: "R"
  status: "maintained"
  summary: "Turns fitted models into manuscript-ready figures. Every effect curve is paired
    with a rug of the raw data stacked directly above it, so a bend in the curve can be read
    against how much data actually supports it. GAMs via gratia, everything else via
    marginaleffects."
  example: |
    fit <- mgcv::gam(y ~ s(sst), data = d)
    plotEffects(fit, d, "sst")
  schematic: "effect-rug"
  docs: "https://camilleross.org/fancyfx/"
  repo: "https://github.com/chross22/fancyfx"
